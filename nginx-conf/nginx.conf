limit_req_zone $binary_remote_addr zone=kimbo_mq:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=kaiko_mq:10m rate=1r/s;

server {
        listen 80;
        listen [::]:80;
        server_name kimbo-ticket.duckdns.org;

	# Bloquear rutas de explotación conocidas
	if ($request_uri ~* "(/cgi-bin/|/eval-stdin\.php|/containers/json|auto_prepend_file|allow_url_include|invokefunction|pearcmd)") {
   	 return 444;
	}

	# Ocultar archivos sensibles
	location ~ /\.(?!well-known/) {
    	deny all;
	}

        location ~ /.well-known/acme-challenge {
          allow all;
          root /var/www/html;
        }

        location / {
                rewrite ^ https://$host$request_uri? permanent;
        }
}

server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name kimbo-ticket.duckdns.org;

	# Bloquear rutas de explotación conocidas
        if ($request_uri ~* "(/cgi-bin/|/eval-stdin\.php|/containers/json|auto_prepend_file|allow_url_include|invokefunction|pearcmd)") {
         return 444;
        }

        # Ocultar archivos sensibles
        location ~ /\.(?!well-known/) {
        deny all;
        }

        server_tokens off;

        ssl_certificate /etc/letsencrypt/live/kimbo-ticket.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kimbo-ticket.duckdns.org/privkey.pem;

        ssl_buffer_size 8k;

        ssl_dhparam /etc/ssl/certs/dhparam-2048.pem;

        ssl_protocols TLSv1.2;
        ssl_prefer_server_ciphers on;

        ssl_ciphers ECDH+AESGCM:ECDH+AES256:ECDH+AES128:DH+3DES:!ADH:!AECDH:!MD5;

        ssl_ecdh_curve secp384r1;
        ssl_session_tickets off;

        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8;

        location = /tiquete/mq {
                limit_except POST {
                        deny all;
                }

                limit_req zone=kimbo_mq;
                limit_req_status 429;

                proxy_pass http://ticket-1-api:3000;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location / {
                try_files $uri @kakeibo;
        }

        location @kakeibo {
                proxy_pass http://ticket-1-api:3000;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-XSS-Protection "1; mode=block" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "no-referrer-when-downgrade" always;
                add_header Content-Security-Policy "default-src * data: 'unsafe-eval' 'unsafe-inline'" always;
                #add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
                # enable strict transport security only if you understand the implications
        }

        root /var/www/html;
        index index.html index.htm index.nginx-debian.html;
}


