services:
  webserver:
    image: nginx:mainline-alpine
    container_name: webserver
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - web-static:/var/www/html
      - ./nginx-conf:/etc/nginx/conf.d
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - dhparam:/etc/ssl/certs
    networks:
      - public
      - containers
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - web-static:/var/www/html
    depends_on:
      - webserver
    command: certonly --webroot --webroot-path=/var/www/html --email ingeniustechnologyfactory@gmail.com --force-renewal --agree-tos --no-eff-email -d kakeibo.duckdns.org
networks:
  public:
  private:
  containers:
    external:
      name: internalNetwork
volumes:
  back-notused:
  db-data:
  certbot-etc:
  certbot-var:
  web-static:
    driver: local
    driver_opts:
      type: none
      device: ./web-static/
      o: bind
  dhparam:
    driver: local
    driver_opts:
      type: none
      device: ./dhparam/
      o: bind
